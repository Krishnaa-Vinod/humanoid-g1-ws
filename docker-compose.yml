services:
  ros2_dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USERNAME: ${USER:-devuser}
        USER_UID: ${UID:-1000}
        USER_GID: ${GID:-1000}
    container_name: g1_ros2_dev
    volumes:
      - ./ros2_ws:/workspace/ros2_ws
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev:/dev
      - /dev/shm:/dev/shm
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_SOFTWARE=1
      - ROS_DOMAIN_ID=0
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true
    working_dir: /workspace/ros2_ws
    command: /usr/bin/bash
